<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE66D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" />
  
  <!-- Fitness dumbbell icon -->
  <g transform="translate(50, 50)">
    <!-- Left weight -->
    <rect x="-35" y="-12" width="10" height="24" rx="2" fill="url(#grad2)" />
    <rect x="-37" y="-8" width="2" height="16" fill="#FFE66D" />
    
    <!-- Bar -->
    <rect x="-25" y="-3" width="50" height="6" rx="3" fill="#FFFFFF" />
    
    <!-- Right weight -->
    <rect x="25" y="-12" width="10" height="24" rx="2" fill="url(#grad2)" />
    <rect x="35" y="-8" width="2" height="16" fill="#FFE66D" />
    
    <!-- Heart symbol overlay (community aspect) -->
    <path d="M 0,-8 C -2,-10 -5,-10 -7,-8 C -9,-6 -9,-3 -7,-1 L 0,6 L 7,-1 C 9,-3 9,-6 7,-8 C 5,-10 2,-10 0,-8 Z" 
          fill="#FFFFFF" opacity="0.9" transform="translate(0, -15) scale(0.8)"/>
  </g>
  
  <!-- Pulse/Activity line -->
  <path d="M 15,75 L 25,75 L 30,65 L 35,85 L 40,70 L 45,75 L 85,75" 
        stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
</svg>
